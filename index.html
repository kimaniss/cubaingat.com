<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO Basic -->
  <title>CubaIngat - Tak Ingat? CubaIngat.</title>
  <meta name="description" content="Web app untuk bantu anda yang selalu lupa. Tak Ingat? CubaIngat." />
  <meta name="keywords" content="CubaIngat, peringatan, task note, pengurusan masa, checklist, aplikasi pelupa" />
  <meta name="author" content="CubaIngat.com" />

  <!-- PWA Manifest & Web App Mobile Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#B5E2FA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CubaIngat" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tak Ingat? CubaIngat." />
  <meta property="og:description" content="Web app untuk bantu anda yang selalu lupa." />
  <meta property="og:url" content="https://cubaingat.com" />
  <meta property="og:image" content="https://arleta.site/interactivelink/118/logo-cubaingat.png" />

  <!-- Favicon -->
  <link rel="icon" href="https://arleta.site/interactivelink/118/logo-cubaingat.png" type="image/png" />

  <style>
    :root {
      --bg-color: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-color: #4A4E69;
      --primary-pastel: #B5E2FA;
      --accent-pastel: #EDAFB8;
      --success-pastel: #E2ECE9;
      --badge-pastel: #E8AEB7;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    img.logo {
      width: 140px;
      height: auto;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-pastel);
      color: #2B2D42;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      margin-bottom: 25px;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: #3D405B;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .task-card {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: var(--border-radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .task-info h4 {
      font-size: 1.05rem;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .task-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .task-info span {
      font-size: 0.8rem;
      color: #6C757D;
      background-color: #F1F5F9;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .badge-repeat {
      background-color: #FFF3BF !important;
      color: #856404 !important;
      font-weight: 600;
    }

    .btn-done {
      background-color: var(--success-pastel);
      border: none;
      color: #2D6A4F;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .btn-done:active {
      background-color: #C1DFD7;
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      padding-bottom: 15px;
    }

    .footer-link a, .history-header a {
      color: #6C5CE7;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .footer-link a:hover, .history-header a:hover {
      text-decoration: underline;
    }

    .backup-section {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px dashed #E2E8F0;
      text-align: center;
    }

    .backup-section p {
      font-size: 0.8rem;
      color: #94A3B8;
      margin-bottom: 10px;
    }

    .backup-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-secondary {
      background-color: #F1F5F9;
      color: #475569;
      border: 1px solid #CBD5E1;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 22px;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .modal-content h3 {
      margin-bottom: 15px;
      color: #3D405B;
    }

    .modal-content label {
      display: block;
      font-size: 0.85rem;
      margin: 12px 0 5px;
      color: #6C757D;
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 12px;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background-color: #FAFAFA;
      color: var(--text-color);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-save {
      flex: 1;
      background-color: var(--accent-pastel);
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      color: #5C2C35;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background-color: #E9ECEF;
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: #495057;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="https://arleta.site/interactivelink/118/logo-cubaingat.png" alt="Logo CubaIngat" class="logo" />
    </header>

    <main id="main-page">
      <button id="btn-open-modal" class="btn-primary">+ Tambah Task</button>

      <h2>Tugasan Hari Ini</h2>
      <div id="task-list" class="task-list"></div>

      <div class="footer-link">
        <a href="#" id="link-to-history">📜 Lihat Sejarah Tugasan</a>
      </div>

      <div class="backup-section">
        <p>💾 Simpan simpanan keselamatan data anda</p>
        <div class="backup-buttons">
          <button id="btn-export" class="btn-secondary">📥 Export Backup</button>
          <button id="btn-import-trigger" class="btn-secondary">📤 Import Backup</button>
        </div>
        <input type="file" id="import-file" accept=".json" class="hidden" />
      </div>
    </main>

    <main id="history-page" class="hidden">
      <div class="history-header">
        <h2>📜 Sejarah Tugasan</h2>
        <a href="#" id="link-to-main">← Kembali ke Utama</a>
      </div>
      <div id="history-list" class="task-list"></div>
    </main>
  </div>

  <!-- Modal Popup -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Tambah Task Baru</h3>
      
      <label for="task-title">Nama Task:</label>
      <input type="text" id="task-title" placeholder="Contoh: Makan ubat gastrik" autocomplete="off">

      <label for="task-time">Pilih Masa Peringatan:</label>
      <input type="time" id="task-time">

      <label for="task-repeat">Task Berulang:</label>
      <select id="task-repeat">
        <option value="none">Sekali sahaja</option>
        <option value="daily">Setiap Hari (Daily)</option>
        <option value="weekly">Setiap Minggu (Weekly)</option>
      </select>

      <div class="modal-actions">
        <button id="btn-save-task" class="btn-save">Simpan</button>
        <button id="btn-cancel-task" class="btn-cancel">Batal</button>
      </div>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('cubaingat_tasks')) || [];
    let history = JSON.parse(localStorage.getItem('cubaingat_history')) || [];
    let swRegistration = null;

    // --- 1. DAFTAR SERVICE WORKER & NOTIFICATION PERMISSION ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            swRegistration = reg;
            console.log('Service Worker berjaya didaftarkan:', reg.scope);
          })
          .catch((err) => {
            console.error('Pendaftaran Service Worker gagal:', err);
          });
      });
    }

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    }

    // --- 2. DOM ELEMENTS & INITIALIZATION ---
    const mainPage = document.getElementById('main-page');
    const historyPage = document.getElementById('history-page');
    const taskModal = document.getElementById('task-modal');

    const btnOpenModal = document.getElementById('btn-open-modal');
    const btnSaveTask = document.getElementById('btn-save-task');
    const btnCancelTask = document.getElementById('btn-cancel-task');

    const linkToHistory = document.getElementById('link-to-history');
    const linkToMain = document.getElementById('link-to-main');

    const taskList = document.getElementById('task-list');
    const historyList = document.getElementById('history-list');

    const inputTitle = document.getElementById('task-title');
    const inputTime = document.getElementById('task-time');
    const inputRepeat = document.getElementById('task-repeat');

    const btnExport = document.getElementById('btn-export');
    const btnImportTrigger = document.getElementById('btn-import-trigger');
    const importFile = document.getElementById('import-file');

    renderTasks();

    // --- 3. EVENT LISTENERS ---
    btnOpenModal.addEventListener('click', () => {
      requestNotificationPermission(); // Minta kebenaran bila pengguna nak mula tambah task
      taskModal.classList.remove('hidden');
      inputTitle.focus();
    });

    btnCancelTask.addEventListener('click', () => {
      taskModal.classList.add('hidden');
      clearInputs();
    });

    btnSaveTask.addEventListener('click', () => {
      const title = inputTitle.value.trim();
      const time = inputTime.value;
      const repeat = inputRepeat.value;

      if (!title) {
        alert("Sila masukkan nama task!");
        return;
      }

      const newTask = {
        id: Date.now(),
        title: title,
        time: time || "Tiada Masa",
        repeat: repeat,
        notified: false
      };

      tasks.push(newTask);
      saveToStorage();
      renderTasks();

      taskModal.classList.add('hidden');
      clearInputs();
    });

    linkToHistory.addEventListener('click', (e) => {
      e.preventDefault();
      mainPage.classList.add('hidden');
      historyPage.classList.remove('hidden');
      renderHistory();
    });

    linkToMain.addEventListener('click', (e) => {
      e.preventDefault();
      historyPage.classList.add('hidden');
      mainPage.classList.remove('hidden');
    });

    // --- 4. EXPORT & IMPORT ---
    btnExport.addEventListener('click', () => {
      const backupData = {
        tasks: tasks,
        history: history,
        exportDate: new Date().toISOString()
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `CubaIngat_Backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    btnImportTrigger.addEventListener('click', () => importFile.click());

    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const importedData = JSON.parse(event.target.result);
          if (importedData.tasks && importedData.history) {
            tasks = importedData.tasks;
            history = importedData.history;
            saveToStorage();
            renderTasks();
            alert("✅ Backup data berjaya dimuat masuk!");
          } else {
            alert("❌ Format fail backup tidak sah.");
          }
        } catch (err) {
          alert("❌ Ralat membaca fail JSON backup.");
        }
      };
      reader.readAsText(file);
      importFile.value = '';
    });

    // --- 5. RENDER FUNCTIONS ---
    function renderTasks() {
      taskList.innerHTML = '';
      if (tasks.length === 0) {
        taskList.innerHTML = '<p style="color:#94A3B8; text-align:center; padding: 20px 0;">Tiada task aktif. Hari yang tenang! ☕</p>';
        return;
      }

      tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'task-card';

        let repeatLabel = '';
        if (task.repeat === 'daily') repeatLabel = '<span class="badge-repeat">🔄 Daily</span>';
        if (task.repeat === 'weekly') repeatLabel = '<span class="badge-repeat">🔄 Weekly</span>';

        card.innerHTML = `
          <div class="task-info">
            <h4>${escapeHTML(task.title)}</h4>
            <div class="task-badges">
              <span>⏰ ${task.time}</span>
              ${repeatLabel}
            </div>
          </div>
          <button class="btn-done" onclick="completeTask(${task.id})">Done</button>
        `;
        taskList.appendChild(card);
      });
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<p style="color:#94A3B8; text-align:center; padding: 20px 0;">Belum ada sejarah task yang selesai.</p>';
        return;
      }

      history.forEach(item => {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.style.opacity = '0.85';

        let repeatBadge = item.repeat && item.repeat !== 'none' ? `<span class="badge-repeat">🔄 ${item.repeat}</span>` : '';

        card.innerHTML = `
          <div class="task-info">
            <h4 style="text-decoration: line-through; color: #8D99AE;">${escapeHTML(item.title)}</h4>
            <div class="task-badges">
              <span>Selesai: ${item.completedAt}</span>
              ${repeatBadge}
            </div>
          </div>
        `;
        historyList.appendChild(card);
      });
    }

    window.completeTask = function(id) {
      const taskIndex = tasks.findIndex(t => t.id === id);
      if (taskIndex > -1) {
        const currentTask = tasks[taskIndex];
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        history.unshift({
          id: Date.now(),
          title: currentTask.title,
          repeat: currentTask.repeat,
          completedAt: timeString
        });

        if (currentTask.repeat === 'daily' || currentTask.repeat === 'weekly') {
          currentTask.notified = false;
        } else {
          tasks.splice(taskIndex, 1);
        }

        saveToStorage();
        renderTasks();
      }
    };

    function saveToStorage() {
      localStorage.setItem('cubaingat_tasks', JSON.stringify(tasks));
      localStorage.setItem('cubaingat_history', JSON.stringify(history));
    }

    function clearInputs() {
      inputTitle.value = '';
      inputTime.value = '';
      inputRepeat.value = 'none';
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // --- 6. PENJADUALAN NOTIFIKASI VIA SERVICE WORKER ---
    setInterval(() => {
      const now = new Date();
      const currentHours = String(now.getHours()).padStart(2, '0');
      const currentMinutes = String(now.getMinutes()).padStart(2, '0');
      const currentTimeString = `${currentHours}:${currentMinutes}`;

      tasks.forEach(task => {
        if (task.time === currentTimeString && !task.notified) {
          triggerPwaNotification(task.title);
          task.notified = true;
          saveToStorage();
        }
      });
    }, 5000);

    function triggerPwaNotification(title) {
      // Getar peranti (fallback jika tidak dikendalikan oleh OS)
      if ("vibrate" in navigator) {
        navigator.vibrate([500, 250, 500]);
      }

      // Hantar pemicu notifikasi ke Service Worker
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'SHOW_NOTIFICATION',
          title: 'CubaIngat ⏰',
          body: `Tak Ingat? CubaIngat: ${title}`
        });
      } else if (swRegistration) {
        swRegistration.showNotification('CubaIngat ⏰', {
          body: `Tak Ingat? CubaIngat: ${title}`,
          icon: 'https://arleta.site/interactivelink/118/logo-cubaingat.png'
        });
      } else {
        alert(`CubaIngat:\n\nTak Ingat? CubaIngat: ${title}`);
      }
    }
  </script>
</body>
</html>
